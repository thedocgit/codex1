name: Build ChatGPT Backup APK
on:
  push:
    paths: ['chatgpt-backup-android/**', '.github/workflows/build-chatgpt-backup-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: chatgpt-backup-android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Backup-Android
          path: chatgpt-backup-android/app/build/outputs/apk/debug/app-debug.apk
