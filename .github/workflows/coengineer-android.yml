name: CoEngineer Android APK
on:
  push:
    branches: [coengineer-android-apk]
    paths:
      - 'CoEngineerAndroid/**'
      - '.github/workflows/coengineer-android.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare Gradle
        run: |
          test -f CoEngineerAndroid/settings.gradle
          gradle --version || true
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build APK
        working-directory: CoEngineerAndroid
        run: /tmp/gradle-8.7/bin/gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: test -s CoEngineerAndroid/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoEngineer-Android-APK
          path: CoEngineerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
