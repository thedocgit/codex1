[project]
name = "ai-orchestrator-desktop"
version = "0.1.0"
description = "Orquestrador multi-IA com memória externa e auditoria"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.2",
  "python-dotenv>=1.0.1"
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3.2",
  "ruff>=0.6.2"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
