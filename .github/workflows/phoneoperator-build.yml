name: Build PhoneOperator APK

on:
  push:
    branches:
      - phoneoperator-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat PhoneOperator/package/part*.b64 | tr -d '\n\r ' | base64 -d > PhoneOperator_source_complete.zip
          echo "602fa3a8ea3b1ca1e66493cbe3285890ec289cd6e9a153e10ad50da49d7a25ea  PhoneOperator_source_complete.zip" | sha256sum -c -
          unzip -q PhoneOperator_source_complete.zip
          sed -i 's|androidx.core:core-ktx:1.19.0|androidx.core:core-ktx:1.17.0|' PhoneOperator/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: PhoneOperator
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s PhoneOperator/app/build/outputs/apk/debug/app-debug.apk
          sha256sum PhoneOperator/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneOperator-debug-apk
          path: PhoneOperator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
