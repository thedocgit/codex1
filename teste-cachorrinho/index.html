<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Teste Relacional</title><style>body{font-family:Arial;background:#f5f5f5;padding:20px}.box{max-width:700px;margin:auto;background:#fff;padding:20px;border-radius:12px}button{width:100%;padding:15px;background:#25D366;color:#fff;border:0;border-radius:8px;font-size:18px}</style></head><body><div class='box'><h1>O que significa "meu cachorrinho"?</h1><form id='f'></form><button onclick='calc()'>Ver resultado</button><pre id='r'></pre><button onclick='wa()'>Enviar WhatsApp</button></div><script>let qs=[['Significado', ['Carinho e lealdade','Dedicação','Obediência','Brincadeira']],['Fidelidade',['Igual para os dois','Espero fidelidade dele','Ele deve se comprometer mais','Depende da situação']],['Dinheiro',['Autonomia','Ajuda mútua','Ele cuida mais','Prova amor ajudando']],['Decisões',['Juntos','Tento convencer','Ele aceita','Ele apoia sempre']]];let h='';qs.forEach((q,i)=>{h+='<p><b>'+q[0]+'</b></p>';q[1].forEach((a,j)=>h+='<label><input type="radio" name="q'+i+'" value="'+j+'">'+a+'</label><br>')});document.getElementById('f').innerHTML=h;let res='';function calc(){let p=0;for(let i=0;i<4;i++){let x=document.querySelector('input[name=q'+i+']:checked');if(!x)return alert('Responda todas');p+=+x.value}let c=p<=3?'Parceira afetiva':p<=7?'Dinâmica de dedicação':p<=11?'Dinâmica de controle':'Dinâmica de poder';res='Pontuação: '+p+'\nClassificação: '+c;document.getElementById('r').textContent=res}function wa(){window.open('https://wa.me/?text='+encodeURIComponent(res))}</script></body></html>
