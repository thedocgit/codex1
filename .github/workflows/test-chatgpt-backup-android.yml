name: Test ChatGPT Backup Android
on:
  push:
    paths: ['chatgpt-backup-android/**', '.github/workflows/test-chatgpt-backup-android.yml']
  workflow_dispatch:
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Wire complete collector
        working-directory: chatgpt-backup-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/thedoc/chatgptbackup/MainActivity.java")
          s=p.read_text()
          a=s.index('    String js="(async()=>')
          b=s.index('    web.evaluateJavascript(js,null);',a)
          s=s[:a]+'    String js=CollectorScript.CODE;\n'+s[b:]
          p.write_text(s)
          PY
      - name: Build APK
        working-directory: chatgpt-backup-android
        run: gradle assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch in Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r chatgpt-backup-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.thedoc.chatgptbackup/.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep com.thedoc.chatgptbackup
            adb shell pidof com.thedoc.chatgptbackup
